name: Pages

on:
  push:
    branches: [main]
  # Builds and checks only; the deploy job skips pull requests. This gives
  # Dependabot's pull requests a build.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys share one group, so a deploy that has started finishes and a newer
# run waits for it. Each pull request has its own group, so its builds never
# queue behind or displace a deploy, and a newer push cancels the older build.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v5
      # Pinned so a new Zola release cannot change the build unseen.
      # Dependabot updates the action's SHA but not the Zola version;
      # bump that by hand.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: zola@0.23.6
          fallback: none
      # Build for the address Pages serves: the github.io project path now,
      # the custom domain once it is set in the repository's settings.
      - env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: zola build --base-url "$BASE_URL"
      # Checks the built pages for accidents against the plan's rule of no
      # scripts and no third-party loads. It fails on a <script tag, an
      # on...= event-handler attribute, a javascript: attribute value, and an
      # absolute URL outside the site's base URL in src= or srcset=, in the
      # href of a <link> whose rel names stylesheet, icon, preload, prefetch,
      # preconnect or manifest, or in a CSS url() or @import. Quoted and
      # unquoted attributes both count (minify_html drops quotes). This
      # catches accidents, not adversaries; the reviewers do the latter.
      # Known limits: srcset candidates after the first; CSS image-set();
      # poster=, object data=, base href=, ping= and SVG image href=; meta
      # refresh; entity-encoded URLs; a tag split across lines; src= or
      # srcset= after a / instead of whitespace or a quote. It also reports
      # src= followed by an off-site URL in page text, and a same-site URL
      # written protocol-relative (//host/...).
      - name: Check for scripts, event handlers and common off-site loads
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -o pipefail
          # grep, but "no match" is not a failure; a real error still is.
          g() { grep "$@" || [ "$?" -eq 1 ]; }
          test -f public/index.html || { echo '::error::public/index.html is missing'; exit 1; }
          status=0
          # report <what> <grep pattern arguments>: list the files that match.
          report() {
            what=$1
            shift
            hits=$(g -rIli "$@" public)
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              echo "::error::the files above contain $what"
              status=1
            fi
          }
          report '<script' -F '<script'
          report 'an on...= event handler' -E "<[a-z][^>]*[[:space:]/\"']on[a-z]+[[:space:]]*="
          report 'a javascript: attribute value' -E "<[a-z][^>]*=[[:space:]]*[\"']?[[:space:]]*javascript:"
          # One "file<TAB>URL" line per src= or srcset= (first candidate only),
          # loading <link> href, url() and @import; keep the absolute URLs not
          # under this site.
          external=$(
            {
              g -rIoiE "(^|[[:space:]\"'])src(set)?[[:space:]]*=[[:space:]]*[\"']?[^\"' >]+" public \
                | sed -E "s/^([^:]*):[^=]*=[[:space:]]*[\"']?/\1\t/" &&
              g -rIoiE '<link[^>]*>' public \
                | g -iE "rel[[:space:]]*=[[:space:]]*(\"[^\"]*|'[^']*|[^\"' >]*)(stylesheet|icon|preload|prefetch|preconnect|manifest)" \
                | sed -nE "s/^([^:]*):.*href[[:space:]]*=[[:space:]]*[\"']?([^\"' >]+).*/\1\t\2/Ip" &&
              g -rIoiE "(url\(|@import)[[:space:]]*(url\()?[[:space:]]*[\"']?[^\"') ;]+" public \
                | sed -E "s/^([^:]*):(url\(|@import)[[:space:]]*(url\()?[[:space:]]*[\"']?/\1\t/I"
            } | awk -F '\t' -v site="${SITE%/}/" '
                  { u = tolower($2) }
                  u ~ /^(https?:)?\/\// && index(u, tolower(site)) != 1'
          )
          if [ -n "$external" ]; then
            printf '%s\n' "$external"
            echo '::error::the files above load something from another site'
            status=1
          fi
          exit "$status"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
