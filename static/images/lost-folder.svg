<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <style>
    .ink { stroke: #2A2135; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 3; }
    .paper { fill: #FFFFFF; }
    .blob { fill: #FFE3C4; }
    .sun { fill: #FFC94A; }
    .coral { fill: #FF7A5C; }
    .mint { fill: #8EDCC8; }
    .dot { fill: #2A2135; }
    .none { fill: none; }
    /* Zippy, the folder from the logo. Its outline turns light in dark, as
       ink on the page does; its face, and the line between its back and
       front, sit on fills that stay the same, so they keep dark ink. */
    .zip { stroke: #2A2135; }
    .zip-face { fill: #2A2135; }
    .zip-line { stroke: #2A2135; }
    @media (prefers-color-scheme: dark) {
      .zip { stroke: #F7EFE5; }
      .ink { stroke: #F7EFE5; }
      .paper { fill: #2D2536; }
      .blob { fill: #342A3F; }
      .dot { fill: #F7EFE5; }
    }
  </style>
  <ellipse class="blob" cx="150" cy="176" rx="118" ry="16"/>
  <g class="ink thin">
    <path class="none" d="M60 92H24M66 112H36M62 132H30"/>
    <circle class="paper" cx="52" cy="170" r="9"/>
    <circle class="paper" cx="34" cy="160" r="6"/>
  </g>
  <g class="ink">
    <path class="none" d="M128 150L116 172H104M172 150L186 170L198 166"/>
  </g>
  <g class="ink thin">
    <path class="none" d="M226 28Q226 14 240 14Q254 14 254 28Q254 38 240 42V50"/>
    <circle class="dot" cx="240" cy="62" r="3.5" stroke="none"/>
  </g>
  <circle class="mint" cx="34" cy="40" r="6"/>
  <circle class="coral" cx="266" cy="100" r="5"/>
  <g transform="translate(150 96) rotate(-8) scale(0.56)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="skewX(-10)" stroke-width="7.5">
      <path class="coral" d="M-78 99A30 30 0 0 1-108 69V-75A24 24 0 0 1-84-99H-32C-20-99-13-94-7-86L2-74C6-68 11-65 19-65H78A30 30 0 0 1 108-35V69A30 30 0 0 1 78 99Z"/>
      <rect class="sun zip-line" x="-108" y="-29" width="216" height="128" rx="30"/>
      <path class="zip" d="M-78 99A30 30 0 0 1-108 69V-75A24 24 0 0 1-84-99H-32C-20-99-13-94-7-86L2-74C6-68 11-65 19-65H78A30 30 0 0 1 108-35V69A30 30 0 0 1 78 99Z"/>
      <circle class="zip-face" cx="2" cy="23" r="14" stroke="none"/>
      <circle class="zip-face" cx="56" cy="23" r="14" stroke="none"/>
      <path class="zip-line" stroke-width="9" d="M6 58Q17 50 28 58T50 58"/>
    </g>
  </g>
</svg>
